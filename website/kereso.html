<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sírkereső</title>
    <meta name="robots" content="noindex" />
    <!-- FR-UGY-02: public grave search, embedded on the operator's website with an iframe.
         Shows only what a headstone shows: name, years, cemetery, plot. -->
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("fonts/instrument-sans-latin-ext-standard-normal.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }
      :root {
        --canvas: #ecf0ec;
        --paper: #ffffff;
        --ink: #17251f;
        --ink-2: #4c5a53;
        --line: #d9dfda;
        --cypress: #1f5546;
        --cypress-soft: #dfe9e3;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 17px/1.5 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      main { max-width: 760px; margin: 0 auto; padding: 20px 16px 28px; }
      h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.01em; }
      .sub { margin: 0 0 18px; color: var(--ink-2); }
      form { display: flex; gap: 8px; }
      label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      input[type="search"] {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        padding: 0 14px;
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--canvas);
      }
      input[type="search"]:focus { outline: 3px solid var(--cypress-soft); border-color: var(--cypress); }
      button {
        min-height: 48px;
        padding: 0 20px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--cypress);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--cypress-soft); outline-offset: 2px; }
      #status { min-height: 1.5em; margin: 14px 0 6px; color: var(--ink-2); }
      ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
      .name { font-weight: 600; }
      .years { color: var(--ink-2); font-variant-numeric: tabular-nums; }
      .where { text-align: right; }
      .plaque {
        display: inline-block;
        margin-left: 8px;
        padding: 1px 8px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        border: 1px solid var(--cypress);
        border-radius: 6px;
        color: var(--cypress);
      }
      footer { margin-top: 18px; font-size: 0.85rem; color: var(--ink-2); }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sírkereső</h1>
      <p class="sub" id="operator">Keressen név vagy évszám alapján.</p>
      <form id="f" role="search">
        <label class="sr" for="q">Elhunyt neve</label>
        <input id="q" name="q" type="search" placeholder="Például: Kovács János 1950" autocomplete="off" minlength="3" required />
        <button type="submit">Keresés</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ol id="results" aria-label="Találatok"></ol>
      <footer>
        Csak azok az adatok látszanak, amelyeket a hozzátartozók nem kértek elrejteni. Hibát talált? Keresse a temető ügyfélszolgálatát.
        <br />Nyilvántartás: <a href="https://temisz.hu" target="_blank" rel="noopener">TEMISZ</a>
      </footer>
    </main>
    <script>
      (function () {
        var token = new URLSearchParams(location.search).get("t") || "";
        var form = document.getElementById("f");
        var q = document.getElementById("q");
        var status = document.getElementById("status");
        var list = document.getElementById("results");
        var operator = document.getElementById("operator");

        function text(tag, cls, value) {
          var el = document.createElement(tag);
          if (cls) el.className = cls;
          el.textContent = value;
          return el;
        }

        function show(results) {
          list.textContent = "";
          results.forEach(function (r) {
            var li = document.createElement("li");
            var who = document.createElement("div");
            who.appendChild(text("span", "name", r.name));
            who.appendChild(document.createTextNode(" "));
            who.appendChild(text("span", "years", (r.birthYear || "?") + "–" + (r.deathYear || "?")));
            var where = document.createElement("div");
            where.className = "where";
            where.appendChild(document.createTextNode(r.cemetery));
            where.appendChild(text("span", "plaque", r.plot));
            li.appendChild(who);
            li.appendChild(where);
            list.appendChild(li);
          });
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var term = q.value.trim();
          if (term.length < 3) {
            status.textContent = "Írjon be legalább 3 betűt.";
            return;
          }
          status.textContent = "Keresés…";
          fetch("/api/public/search?t=" + encodeURIComponent(token) + "&q=" + encodeURIComponent(term))
            .then(function (res) {
              return res.json().then(function (body) {
                return { ok: res.ok, status: res.status, body: body };
              });
            })
            .then(function (r) {
              if (!r.ok) {
                list.textContent = "";
                status.textContent =
                  r.status === 429 ? "Túl sok keresés. Próbálja újra egy perc múlva." : r.status === 404 ? "A sírkereső most nem érhető el." : "Hiba történt. Próbálja újra később.";
                return;
              }
              if (r.body.operator) operator.textContent = r.body.operator;
              show(r.body.results);
              status.textContent = r.body.results.length ? r.body.results.length + " találat" : "Nincs találat. Próbálja más írásmóddal vagy csak a családnévvel.";
            })
            .catch(function () {
              status.textContent = "Nincs kapcsolat. Próbálja újra később.";
            });
        });
      })();
    </script>
  </body>
</html>
