# Root package: the Vercel Function (api/rpc.rs). Vercel's Rust runtime
# builds the [[bin]] entries of the Cargo.toml in the project root.
[package]
name = "temisz-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
lunda-core = { path = "crates/lunda-core" }
temisz-server = { path = "crates/temisz-server", default-features = false }
vercel_runtime = "2"
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"

[[bin]]
name = "rpc"
path = "api/rpc.rs"

[workspace]
resolver = "2"
members = ["crates/lunda-core", "crates/temisz-server", "crates/temisz-desktop-import"]
# vendored crates (patched, see [patch.crates-io]) are not members
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "UNLICENSED"
authors = ["Lunda Software"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# tiny_http 0.12 with a fix of its connection thread pool (see the comment in
# vendor/tiny_http/src/util/task_pool.rs); no newer release has it
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
