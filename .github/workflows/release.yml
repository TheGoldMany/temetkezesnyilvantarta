# Release build: Windows (x64: NSIS + MSI, ARM64: NSIS) and macOS universal (.dmg),
# signed when the secrets below exist, with signed updater packages and latest.json.
# The release is published right away: the download website (website/, on
# Vercel) always links to the latest release.
#
# Start it by pushing a tag (git tag v0.1.0, git push origin v0.1.0) or run it
# manually (Actions → Release → Run workflow): it then tags v<app version>.
#
# Secrets (Settings → Secrets and variables → Actions). Everything is optional:
# without them the installers are built unsigned (Windows SmartScreen and macOS
# Gatekeeper will warn).
#   TAURI_SIGNING_PRIVATE_KEY            updater key (pnpm tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
#   WINDOWS_CERTIFICATE                  code signing .pfx, base64 encoded
#   WINDOWS_CERTIFICATE_PASSWORD         .pfx password
#   WINDOWS_CERTIFICATE_THUMBPRINT       SHA-1 thumbprint of the certificate
#   APPLE_CERTIFICATE                    "Developer ID Application" .p12, base64
#   APPLE_CERTIFICATE_PASSWORD           .p12 password
#   APPLE_SIGNING_IDENTITY               e.g. "Developer ID Application: Lunda Software (TEAMID)"
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8   App Store Connect API key for notarization
# Repository variables (not secret):
#   TAURI_UPDATER_PUBKEY   public key printed by `tauri signer generate`
#   UPDATER_ENDPOINT       e.g. https://updates.lunda.hu/temeto/{{target}}/{{arch}}/{{current_version}}
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis # WiX (MSI) does not support ARM64
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # secrets cannot be used in `if:` directly – expose "is it set" flags
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile

      # ---- build-time configuration (updater key/URL, Windows thumbprint)
      - name: Release configuration
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
          THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          node -e '
            const c = { bundle: { createUpdaterArtifacts: !!process.env.TAURI_SIGNING_PRIVATE_KEY, windows: {} }, plugins: { updater: {} } };
            if (process.env.PUBKEY) c.plugins.updater.pubkey = process.env.PUBKEY;
            if (process.env.ENDPOINT) c.plugins.updater.endpoints = [process.env.ENDPOINT];
            if (process.env.THUMBPRINT) Object.assign(c.bundle.windows, { certificateThumbprint: process.env.THUMBPRINT, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" });
            require("fs").writeFileSync("src-tauri/tauri.release.conf.json", JSON.stringify(c, null, 2));
          '
          cat src-tauri/tauri.release.conf.json

      # ---- Windows code signing certificate (optional)
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Recurse -Force certificate

      # ---- Apple notarization key file (optional)
      - name: Apple API key
        if: runner.os == 'macOS' && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> $GITHUB_ENV

      # Tauri treats an empty APPLE_* variable as "set" and fails to import an
      # empty certificate, so only export the ones that really exist.
      - name: Apple signing variables
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag push: use the tag; manual run: tauri-action creates v<app version>
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Lunda Temető v__VERSION__"
          releaseBody: "Telepítők Windowsra (x64, ARM64) és macOS-re (Apple Silicon és Intel)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
