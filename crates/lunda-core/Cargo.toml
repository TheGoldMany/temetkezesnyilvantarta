[package]
name = "lunda-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lunda Temeto core: database, business rules, audit, printing, import/export, backup"

[features]
default = []

[dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "collation", "functions", "backup", "serde_json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
thiserror = "2"
krilla = "0.8"
ttf-parser = "0.25"
qrcode = { version = "0.14", default-features = false }
