[package]
name = "lunda-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lunda Temeto core: database, business rules, audit, printing, import/export, backup"

[features]
default = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand = "0.8"
thiserror = "2"
krilla = "0.8"
calamine = { version = "0.38", features = ["dates"] }
csv = "1"
rust_xlsxwriter = "0.102"
encoding_rs = "0.8"
ttf-parser = "0.25"
qrcode = { version = "0.14", default-features = false }
postgres = "0.19"
bytes = "1"
webpki-roots = "1.0.11"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
