[package]
name = "temisz-desktop-import"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reads backups of the retired TEMISZ desktop app (SQLCipher, recovery key) for import into the web service"
publish = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "collation"] }
serde_json = "1"
lunda-core = { path = "../lunda-core" }
